name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name StarCitizenVoiceKeybinds starcitizen_voice_keybinds.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: StarCitizenVoiceKeybinds-Windows
          path: dist/StarCitizenVoiceKeybinds.exe
